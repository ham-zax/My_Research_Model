[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfsm-e001"
version = "0.1.0"
description = "Experiment 001 BTC research pipeline"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.0.2"]
collect = [
    "websockets==17.0.1",
]
eval = [
    "scikit-learn==1.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
